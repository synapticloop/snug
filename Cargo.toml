[workspace]
resolver = "2"
members = [
    "crates/snug-format",
    "crates/snug-payload",
    "crates/snug-cli",
    "crates/snug-launcher",
    "crates/snug-dropper",
]

[workspace.package]
# Single source of truth for the snug version. All crates inherit it
# via `version.workspace = true`, so this is the only place a bump is
# needed. See "Versioning" in AGENTS.md for the increment rule (and
# the pre-1.0 ceiling). Micro-only: the project sits at 0.9.x, and
# AGENTS.md says to keep incrementing the patch rather than roll over
# to 1.0.0.
version = "0.10.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/synapticloop/snug"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
thiserror = { version = "1" }
sha2 = { version = "0.10" }
crc32fast = { version = "1" }
clap = { version = "4", features = ["derive", "wrap_help"] }
anyhow = { version = "1" }
zip = { version = "2", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_LibraryLoader",
    "Win32_System_Environment",
    "Win32_System_Registry",
    "Win32_System_Console",
    # `LockFileEx`/`UnlockFileEx` (the cross-process JDK install lock) take an
    # `*mut OVERLAPPED`, which windows-sys gates behind this feature.
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
jni = { version = "0.22", features = ["invocation"] }
editpe = { version = "0.2", default-features = false, features = ["images"] }
# Already in the tree transitively (via zip), so this costs nothing extra.
# Used to reject a malformed `--manifest` at build time rather than letting
# it surface as an SxS activation failure on the target machine.
quick-xml = { version = "0.42", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
serde_json = "1"

[patch.crates-io]
# Local fork of `editpe` with `set_rcdata` / `get_rcdata` methods (snug
# slice 4 — payload stored as an `RT_RCDATA` resource entry instead of
# appended as a binary overlay). Keep in sync with upstream
# https://github.com/Systemcluster/editpe/releases; the only intended
# delta is the two new methods plus this comment.
editpe = { path = "vendor/editpe" }

[profile.release]
opt-level = "z"     # the launcher should be tiny
lto = true
codegen-units = 1
panic = "abort"
strip = true
