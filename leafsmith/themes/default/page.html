<!doctype html>
<html lang="{{site.language}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{page.title}} | {{site.title}}</title><meta name="description" content="{{page.description}}"><link rel="stylesheet" href="leafsmith-style.css">{{head.stylesheet}}<script defer src="app.js"></script></head><body class="leafsmith-body"><header class="leafsmith-topbar"><div class="leafsmith-topbar-inner"><div class="leafsmith-topbar-start">{{page.logo}}{{nav.topLeft}}</div><a class="leafsmith-brand" href="index.html">{{site.title}}</a><div class="leafsmith-topbar-end">{{nav.topRight}}</div></div></header><div class="leafsmith-shell"><aside class="leafsmith-sidebar">{{chapter.navigation}}<div class="leafsmith-slot">{{sidebar.bottomLeft}}</div></aside><main class="leafsmith-reading" id="leafsmith-reading"><small class="leafsmith-page-label">{{page.label}}</small><h1 class="leafsmith-title">{{page.title}}</h1><div class="leafsmith-content">{{page.content}}</div>{{chapter.previousNext}}</main><aside class="leafsmith-toc" aria-label="On this page"><div class="leafsmith-eyebrow">On this page</div>{{page.contents}}<div class="leafsmith-slot">{{sidebar.bottomRight}}</div></aside></div>{{page.footer}}</body></html>
