#
#                             LEAFSMITH PROJECT SETTINGS
#
# This file is the whole configuration. Every setting Leafsmith understands is
# listed here, and it is the only file a build reads: settings come from this
# file and from nowhere else.
#
# `leafsmith --init` writes this file for you.
#
# Paths are resolved relative to this file's own directory, not the working
# directory, so this project folder stays self-contained and can be moved or
# invoked from anywhere.

# ----------------------------------------------------------------------------
# Build settings
# ----------------------------------------------------------------------------
#
# Where the conversion happens and what it produces. These are a property of
# the project rather than of the book, so they are read from this file alone.

# Required. An HTML as a ZIP.
build.input=export/Say Hello To Snug.zip

# Where the generated static site is written - this directory is chosen for th
# historical github gh-pages output directory
build.output=docs/

# Where this project's theme lives, and the theme the build uses. The bundled default theme is
# written there on the next run, adding only files that are not already present, so editing one
# never gets overwritten and a file you delete quietly comes back.
build.themeDir=leafsmith/themes/default

# Must be true or false. Exits with code 2 when the conversion reports warnings.
build.strict=false

# Must be true or false. When true, the document's own appearance is kept: every content
# element's inline style and class, and its stylesheet re-emitted on each page and scoped to the
# theme's content wrapper. The default strips both, so the theme alone styles the content.
build.preserveDocumentStyles=true

# Must be true or false. Strips decorative characters from page titles: leading and trailing
# rules, repeated punctuation, and a trailing full stop. Off by default because whether those are
# an artefact or deliberate is a judgement about the document, not a structural fact.
build.tidyTitles=false

# ----------------------------------------------------------------------------
# Site settings
# ----------------------------------------------------------------------------

# Required. Used in the header, the page title, and the site description.
site.title=Say Hello To Snug
site.author=Synapticloop
site.language=en
site.edition=Original Edition
site.tagline=Build it. Brand it. Deploy it.
site.description='Say Hello to Snug' book and user manual

# The logo, shown in the top bar and linked to the site's first page. A path relative to this
# settings file. Blank means no logo.
site.logo=leafsmith/assets/snug-icon.png

# Icons for the browser tab and for a phone home screen. Paths relative to this settings file.
# Blank means none.
site.favicon=leafsmith/assets/snug-icon.png
site.appleTouchIcon=

# The share card image, and the address the finished site is published at. ogImage is the
# 1200x630 card; site.url is the public address, used to build absolute links for social
# previews. A relative ogImage is resolved against site.url.
site.ogImage=
site.url=

# The project's assets.  All files and directories are recreated in the output
# directory so that they can be linked to from the HTML (generally useful whn
# using snippet files.
site.assets=leafsmith/assets/

# HTML repeated at the foot of every page. Any HTML is allowed and it is inserted as written,
# so this is the one content setting to treat as trusted input. Set to an empty value for no
# footer at all, which also removes the Leafsmith attribution.
site.footer=<p>&copy; Synapticloop</><p>Proudly generated with <a href="https://github.com/synapticloop/leafsmith">Leafsmith</a></p>

# The same footer held in a file, for one that outgrows a single line. Set it and it wins over
# site.footer above; leave it blank and site.footer is used. The file is inlined as written, so a
# footer spanning several lines stays readable here instead of becoming one escaped run.
site.footerFile=

# A stylesheet of your own, copied into the generated site and linked from every page, after the
# theme's own leafsmith-style.css so it can override it. Blank means none.
site.stylesheet=leafsmith/snippets/snippets.css

# Space above and below every table, in pixels. Exported documents set their tables directly
# against the text around them, which reads as one block once the frames are gone. Blank or zero
# leaves the tables exactly as they were. Adjacent margins collapse, so two tables set to the
# same number are that many pixels apart rather than twice that.
site.tableMarginTop=12
site.tableMarginBottom=12

# HTML dropped into fixed places in the theme's chrome. Each names a file in your project; it is
# copied into the site and its contents inserted as written, so a fragment can use markup but not
# {{placeholders}} - the file is inlined, not templated, exactly like site.footer above. Blank
# means nothing in that place.
site.navTopLeft=leafsmith/snippets/nav-top-left.html
site.navTopRight=leafsmith/snippets/nav-top-right.html
site.sidebarBottomLeft=leafsmith/snippets/sidebar-bottom-left.html
site.sidebarBottomRight=leafsmith/snippets/sidebar-bottom-right.html

# ----------------------------------------------------------------------------
# Chapter settings
# ----------------------------------------------------------------------------

# CSS selector whose elements start a new page.
# Set to an empty value to keep each HTML source document as one page.
chapter.selector=h1
chapter.label=Chapter
chapter.indexLabel=Introduction

# ----------------------------------------------------------------------------
# Reporting
# ----------------------------------------------------------------------------

# Report obvious editorial placeholders such as TK: and [IMAGE: ...] without removing them.
report.draftMarkers=true

# ----------------------------------------------------------------------------
# Document settings
# ----------------------------------------------------------------------------

# Title for the pages that come before the first chapter boundary.
#
# Chapters take their title from their own heading, so this only names the leading page. Left
# empty, Leafsmith takes it from the HTML file: its <title> if it has one, otherwise the file
# name with the extension stripped. Exports often have neither, which is how a page ends up
# titled after a download name like "MyProjectNameDocumentation".
document.title=Say Hello to Snug

# ----------------------------------------------------------------------------
# Theme settings
# ----------------------------------------------------------------------------

# The CSS selector that wraps the page content in the theme. It is the scope the document's own
# stylesheet is rewritten to, so those rules cannot reach the theme's own chrome. Left empty,
# Leafsmith reads the wrapper from the theme's template and finds it there.
theme.contentScope=
