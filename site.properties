# Leafsmith build settings. Relative paths resolve against this file's own directory.

# Required. The HTML export, a directory, or a ZIP to convert.
build.input=export/Say Hello To Snug.zip

# Where the generated static site is written.
build.output=docs

# A bundled theme name, or a path to a theme directory.
build.theme=default

# Where this project's theme lives. The bundled default theme is written there on the
# next run, adding only files that are not already present, so editing one never gets
# overwritten and a file you delete quietly comes back.
build.themeDir=leafsmith/themes/default

# Exit with code 2 when the conversion reports warnings.
build.strict=false

# When true, keep the document's own appearance: every content element's inline style
# and class, and its stylesheet re-emitted on each page and scoped to the theme's
# content wrapper. The default strips both, so the theme alone styles the content.
build.preserveDocumentStyles=true

# When true, strip decorative characters from page titles: leading and trailing rules,
# repeated punctuation, and a trailing full stop. Off by default because whether they are
# an artefact or deliberate is a judgement about the document, not a structural fact.
build.tidyTitles=true

# When true, the document's own stylesheet is preserved and re-emitted, and the
# document's classes and inline styles are carried across into the page. When false,
# only the theme styles the rendered content.
# build.preserveDocumentStyles=false
# build.tidyTitles=false

# Properties referenced by the default template.
#
# The build copies this file into the JAR, and `leafsmith --init` writes these content settings
# into the project settings file it is given, below the build.* settings that file also needs.
# When this directory is used as a theme, these values act as its defaults; a project settings
# file is loaded afterwards and wins on conflict.

# Required. Used in the header, the page title, and the site description.
site.title=Say Hello To Snug
site.author=Synapticloop
site.language=en
site.edition=Original Edition
site.tagline=Build it. Brand it. Deploy it.
site.description='Say Hello to Snug' book and user manual
site.logo=assets/snug-icon.png
site.favicon=assets/snug-icon.png

# HTML repeated at the foot of every page. Set to an empty value for no footer.
site.footer=<p>&copy; Synapticloop</><p>Proudly generated with <a href="https://github.com/synapticloop/leafsmith">Leafsmith</a></p>

# The same footer held in a file, for one that outgrows a single line. Wins over site.footer
# when set. A path relative to this settings file, or empty to use site.footer instead.
site.footerFile=

# HTML dropped into fixed places in the theme's chrome. Each names a file in your project; it is
# copied into the site and its contents inserted as written, so a fragment can use markup but not
# {{placeholders}} - the file is inlined, not templated, exactly like site.footer above. Blank
# means nothing in that place.
site.navTopLeft=leafsmith/snippets/nav-top-left.html
site.navTopRight=leafsmith/snippets/nav-top-right.html
site.sidebarBottomLeft=leafsmith/snippets/sidebar-bottom-left.html
site.sidebarBottomRight=leafsmith/snippets/sidebar-bottom-right.html


# A stylesheet of your own, copied into the site and linked from every page.
# A path relative to this settings file, or empty for none.
site.stylesheet=leafsmith/snippets/snippets.css

# Space above and below every table, in pixels. Empty or zero for no extra space.
site.tableMarginTop=12
site.tableMarginBottom=12

# CSS selector whose elements start a new page.
# Set to an empty value to keep each HTML source document as one page.
chapter.selector=h1
chapter.label=Chapter
chapter.indexLabel=Introduction

# Report obvious editorial placeholders such as TK: and [IMAGE: ...] without removing them.
report.draftMarkers=true
