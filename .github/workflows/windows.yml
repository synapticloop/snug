      # earlier steps first.
      #
      # This was `continue-on-error` from the day it was added, on the
      # understanding that the workspace carried pre-existing lints in
      # snug-format / snug-payload. Those are cleared, so the exemption goes
      # too rather than being left behind to quietly absorb the next one.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings