[package]
name = "snug-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Windows runtime that scans itself for the snug payload, locates a compatible JVM, and launches the embedded fat JAR via JNI."

[lib]
name = "snug_launcher"
path = "src/lib.rs"

[[bin]]
name = "snug-launcher"
path = "src/main.rs"

[dependencies]
snug-format = { path = "../snug-format" }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }
# `editpe` is deliberately *unconditional*, unlike `windows-sys` / `jni`
# below. It is a pure Rust PE/COFF parser with no Win32 dependency, and
# `payload_locator` needs it on every platform: it reads the `RT_RCDATA`
# "SNUGEMBD" entry out of the launcher stub's PE image. That lookup is
# platform-neutral — it parses a *file format*, it does not call a
# platform API — and `snug-cli` builds Windows EXEs from macOS and
# Linux, so gating it behind `cfg(windows)` broke `cargo build -p
# snug-cli` everywhere but Windows. (The visible symptom was a batch of
# `E0277: the size for values of type [u8] cannot be known at
# compilation time` errors from `get_rcdata` — the unresolved-crate
# return type, not a real bug.)
editpe = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
# `ureq` is Windows-only. Its only reader is `jdk_install` (the Adoptium
# runtime download in the launcher runtime), which is itself
# `#![cfg(windows)]`. On macOS `native-tls` resolves to Security.framework
# via `security-framework`, so leaving `ureq` unconditional made a macOS
# `snug` link a system framework for an update check the CLI never
# performs.
ureq = { workspace = true }

# `jni` is needed by every target that has a real launcher runtime, not
# just Windows: `platform/macos.rs` loads `libjvm.dylib` through the same
# `jni` invocation API. Scoped this way it stays out of the Linux build,
# where `platform/other.rs` is a deliberate no-op and would only warn
# about unused dependencies.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
jni = { workspace = true }

# macOS-only: `NSHomeDirectory` is how snug asks the OS where the per-user
# cache directory is, rather than hardcoding `~/Library/Caches`. Windows
# reads %LOCALAPPDATA% through the Win32 API and needs none of this.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["alloc", "std", "NSString", "NSPathUtilities"] }
# `confstr` is how snug asks macOS where the per-user cache directory is,
# rather than hardcoding `~/Library/Caches`. Windows reads
# %LOCALAPPDATA% through the Win32 API instead, so it needs no libc.


# `build.rs` (this file's sibling) wraps `assets/snug-icon.png` as
# a single-entry ICO and embeds it as `MAINICON` via `embed-resource`
# so `find_best_icon_hicon` in `jdk_install.rs` finds the icon when
# the dialogs need an EXE-icon fallback for the mascot slot.
[build-dependencies]
embed-resource = { version = "3", default-features = false }
image = { workspace = true }

# A precompiled stub launcher is cross-compiled from macOS / Linux via
# `cargo zigbuild` and committed at bin/launcher-stub.exe. Snug-cli's
# builder (slice 3) embeds it via include_bytes!() and appends the
# encoded payload.
[package.metadata.cargo-zigbuild]
# Reserved for future use.
