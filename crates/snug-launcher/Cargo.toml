[package]
name = "snug-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Windows runtime that scans itself for the snug payload, locates a compatible JVM, and launches the embedded fat JAR via JNI."

[lib]
name = "snug_launcher"
path = "src/lib.rs"

[[bin]]
name = "snug-launcher"
path = "src/main.rs"

[dependencies]
snug-format = { path = "../snug-format" }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }
ureq = { workspace = true }
toml = { version = "0.8", default-features = false, features = ["parse"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
jni = { workspace = true }
editpe = { workspace = true }

# A precompiled stub launcher is cross-compiled from macOS / Linux via
# `cargo zigbuild` and committed at bin/launcher-stub.exe. Snug-cli's
# builder (slice 3) embeds it via include_bytes!() and appends the
# encoded payload.
[package.metadata.cargo-zigbuild]
# Reserved for future use.

# Dev-only: the `progress_preview` bin uses this to decode
# `assets/snug-icon.png` into a DIB section that the dialog paints
# into the mascot slot. Keeping `image` here (not in `[dependencies]`)
# means the production launcher-stub and the embedded icon-resource
# path are unaffected.
[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
