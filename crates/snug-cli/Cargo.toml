[package]
name = "snug-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Command-line interface for snug — wrap a Java fat JAR into a native Windows .exe launcher."

[[bin]]
name = "snug"
path = "src/main.rs"

[lib]
name = "snug_cli"
path = "src/lib.rs"

[dependencies]
snug-format = { path = "../snug-format" }
snug-launcher = { path = "../snug-launcher" }
serde = { workspace = true }
postcard = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }
shell-words = { workspace = true }
